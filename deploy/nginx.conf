server {
    listen 80;
    listen [::]:80;
    server_name usermanager-test.tech;

    # unico caminho servido em HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 no listen, e nao como diretiva propria, que so existe a partir do nginx 1.25.1
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name usermanager-test.tech;

    ssl_certificate     /etc/letsencrypt/live/usermanager-test.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usermanager-test.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
