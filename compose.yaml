services:
  app:
    build: .
    image: user-manager:1.1.0
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
    volumes:
      - user-manager-data:/app/data
    restart: unless-stopped

volumes:
  user-manager-data:
