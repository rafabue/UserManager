spring:
  application:
    name: user-manager

  datasource:
    url: jdbc:h2:file:${APP_DB_PATH:./data/usermanager};DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: ${APP_DB_USERNAME:sa}
    password: ${APP_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${APP_PORT:8080}
  # atras do proxy reverso, o location do 201 precisa do host e do esquema original
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  admin:
    # usuario tecnico que autentica as chamadas da API
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin123}
